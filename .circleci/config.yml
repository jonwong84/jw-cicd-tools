version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install package with dev dependencies
          command: pip install -e ".[dev]"
      - run:
          name: Run tests
          command: pytest -v --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

  release:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install jw-cicd-tools (self — dogfoods its own release logic)
          command: pip install -e .
      - run:
          name: Stamp changelog, tag, and push release
          command: |
            git config user.name "CircleCI"
            git config user.email "ci@users.noreply.github.com"
            REPO_URL="https://${GITHUB_TOKEN}@github.com/jonwong84/jw-cicd-tools.git"

            attempt=1
            while true; do
              # On main this prints the version that will be released, or a
              # blank line when [Unreleased] has no entries. A ChangelogError
              # fails the job loudly (bash runs with -e here).
              VERSION=$(jw_cicd version resolve --changelog CHANGELOG.md --branch "$CIRCLE_BRANCH")
              if [ -z "$VERSION" ]; then
                echo "Nothing to release."
                exit 0
              fi
              echo "Releasing version: $VERSION"

              # Check origin directly rather than a local tag ref — `git
              # fetch --tags` doesn't prune local tags that were deleted
              # from the remote. [Unreleased] has entries here, so an
              # existing tag for this version means something is wrong.
              if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
                echo "Tag v$VERSION already exists on origin, but [Unreleased] still has entries." >&2
                exit 1
              fi

              jw_cicd release stamp --changelog CHANGELOG.md >/dev/null
              git add CHANGELOG.md
              git commit -m "Release v$VERSION [skip ci]"
              git tag -a "v$VERSION" -m "Release v$VERSION"

              # Atomic: the stamp commit and the tag land together or not at
              # all. This is also the first step that writes to the remote,
              # so a ruleset rejection leaves nothing tagged or published.
              if git push --atomic "$REPO_URL" HEAD:refs/heads/main "refs/tags/v$VERSION" 2>push_error.log; then
                echo "Released v$VERSION"
                exit 0
              fi

              # Rule/protection violations are not retryable. Confirm the
              # exact GitHub error strings from the first real run.
              if grep -qE 'GH013|GH006|protected branch|rule violations' push_error.log; then
                echo "Push to main was rejected by a branch rule:" >&2
                cat push_error.log >&2
                exit 1
              fi

              if [ "$attempt" -ge 2 ]; then
                echo "Push failed after retry:" >&2
                cat push_error.log >&2
                exit 1
              fi

              # main probably moved (a concurrent merge). Reset to origin and
              # recompute once. If a concurrent job already released, then
              # [Unreleased] is now empty and the loop exits 0 above.
              echo "Push rejected; resetting to origin/main and retrying once."
              cat push_error.log
              git tag -d "v$VERSION"
              git fetch origin main
              git reset --hard origin/main
              attempt=$((attempt + 1))
            done

workflows:
  build-test-release:
    jobs:
      - build-and-test:
          filters:
            branches:
              only:
                - main
                - /^feature\/.*/
      - release:
          context: global-v1
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - main