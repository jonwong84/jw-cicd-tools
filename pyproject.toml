[project]
name = "jw-cicd-tools"
version = "0.1.0"
description = "Personal, reusable CI/CD tooling (versioning, build/test/publish helpers)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
jw_cicd = "jw_cicd_tools.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
